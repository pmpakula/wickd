name: Update top movers
on:
  schedule:
    - cron: '40 21 * * 1-5'   # ~4:40 PM ET (winter) / 5:40 PM ET (summer), after the close
    - cron: '15 12 * * 1-5'   # ~7:15 AM ET backup before the open
  workflow_dispatch:           # "Run workflow" button for a manual refresh
permissions:
  contents: write
concurrency: movers
jobs:
  movers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch movers
        env:
          AV_KEY: ${{ secrets.AV_KEY }}
        run: node .github/scripts/movers.mjs
      - name: Save movers.json
        run: |
          git config user.name "wickd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movers.json
          git diff --cached --quiet || (git commit -m "Update top movers" && git push)
