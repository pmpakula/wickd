<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1a14"/><stop offset="1" stop-color="#05080a"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6bff9e"/><stop offset="1" stop-color="#12c26a"/></linearGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d00"/><stop offset=".55" stop-color="#ff9a00"/><stop offset="1" stop-color="#ffe066"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#1f3a2a" stroke-width="4"/>
  <g filter="url(#glow)" stroke-linecap="round">
    <!-- red candle -->
    <line x1="140" y1="248" x2="140" y2="392" stroke="#ff4d5e" stroke-width="10"/>
    <rect x="110" y="282" width="60" height="78" rx="12" fill="#ff4d5e"/>
    <!-- mid green -->
    <line x1="256" y1="176" x2="256" y2="372" stroke="#3ee887" stroke-width="10"/>
    <rect x="226" y="214" width="60" height="122" rx="12" fill="url(#gr)"/>
    <!-- tall green -->
    <line x1="372" y1="150" x2="372" y2="342" stroke="#3ee887" stroke-width="10"/>
    <rect x="342" y="170" width="60" height="146" rx="12" fill="url(#gr)"/>
  </g>
  <!-- flame on tallest wick -->
  <path filter="url(#glow)" fill="url(#fl)" d="M372 64c10 22 40 40 40 74a40 40 0 0 1-80 0c0-18 10-28 18-38 2 14 8 22 16 24-6-22-2-42 6-60z"/>
  <path fill="#fff4c2" d="M372 112c6 10 16 18 16 32a16 16 0 0 1-32 0c0-10 8-18 16-32z"/>
</svg>
